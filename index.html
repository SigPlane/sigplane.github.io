<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SigPlane.io</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg: #0b0d17;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --violet: #a78bfa;
    --grad: linear-gradient(135deg, #7c3aed 0%, #22d3ee 100%);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 60% 50% at 50% 45%, rgba(124, 58, 237, 0.16), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 4vw, 32px);
    text-align: center;
  }
  .mark { width: clamp(64px, 14vw, 96px); height: auto; }
  h1 {
    font-size: clamp(2.5rem, 9vw, 5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  a {
    color: var(--muted);
    font-size: clamp(0.95rem, 2.5vw, 1.1rem);
    text-decoration: none;
    border-bottom: 1px solid rgba(148, 163, 184, 0.35);
    padding-bottom: 2px;
    transition: color 0.15s, border-color 0.15s;
  }
  a:hover { color: var(--violet); border-color: var(--violet); }
  a:focus-visible { outline: 2px solid var(--violet); outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#22d3ee"/>
      </linearGradient>
    </defs>
    <path d="M8 22 L8 10 L16 10 A4 4 0 0 1 16 18 L12 18 L12 14 L16 14"
          stroke="url(#g)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="22" r="2.5" fill="url(#g)"/>
  </svg>
  <h1>SigPlane.io</h1>
  <a href="mailto:hello@sigplane.io">hello@sigplane.io</a>
</main>
</body>
</html>
